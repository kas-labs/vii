name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|refactor|docs|test|chore|build|ci|perf|security|release|revert)/[a-z0-9]+([a-z0-9-]*[a-z0-9])?$'
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "Invalid branch name: $HEAD_REF"
            echo "Expected: <type>/<short-kebab-description>"
            echo "Allowed types: feat fix refactor docs test chore build ci perf security release revert"
            exit 1
          fi

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|refactor|docs|test|chore|build|ci|perf|security|release|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Invalid pull request title: $PR_TITLE"
            echo "Expected a Conventional Commit style title, for example: docs(governance): align delivery rules"
            exit 1
          fi

      - name: Reject tool or co-author attribution in pull request text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          text="$PR_TITLE"$'\n'"${PR_BODY:-}"
          if printf '%s\n' "$text" | grep -Eiq 'Co-Authored-By:|Generated[[:space:]]+with|Made[[:space:]]+with|Generated[[:space:]]+by'; then
            echo "Pull request text contains forbidden authorship/tool attribution."
            exit 1
          fi

      - name: Reject co-author or generated-by attribution in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          messages="$(git log --format='%B%n---Vii-Commit-Boundary---' "$BASE_SHA..$HEAD_SHA")"
          if printf '%s\n' "$messages" | grep -Eiq 'Co-Authored-By:|Generated[[:space:]]+with|Made[[:space:]]+with|Generated[[:space:]]+by'; then
            echo "One or more commit messages contain forbidden authorship/tool attribution."
            exit 1
          fi

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|refactor|docs|test|chore|build|ci|perf|security|release|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "Invalid commit subject: $subject"
              failed=1
            fi
          done < <(git log --format='%s' "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
